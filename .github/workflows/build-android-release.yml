name: build-android

# Se dispara al pushear un tag con formato vX.Y.Z, ej.:
#   git tag v0.2.0 && git push --tags
#
# Hace todo el flujo que antes era manual:
#   1. Instala dependencias (Node, Rust, Android SDK/NDK)
#   2. Restaura el keystore de firma desde los secrets
#   3. Buildea el frontend (Next export) y el APK universal firmado
#   4. Crea el GitHub Release con el tag
#   5. Sube el .apk como asset del release
#
# Requiere estos secrets ya configurados en el repo (Settings → Secrets and
# variables → Actions):
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON_BASE64  (google-services.json de Firebase, en base64)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # necesario para crear el Release y subir el asset

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Configurar NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Instalar dependencias de npm
        run: npm ci

      - name: Sincronizar version en tauri.conf.json con el tag
        # El tag que dispara este workflow (ej. v0.4.28) es la fuente de
        # verdad de la versión — sin este paso, tauri.conf.json podía
        # quedar desincronizado (ej. en "0.1.0" para siempre), lo que rompe
        # el chequeo de "hay actualización disponible" en la app: getVersion()
        # siempre reportaba una versión vieja y el banner de update nunca
        # se apagaba, aunque ya tuvieras la última versión instalada.
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"  # quita el prefijo "v" -> "0.4.28"
          CONF="src-tauri/tauri.conf.json"

          echo "Seteando version=\"$VERSION\" en $CONF (tag: $TAG)"
          python3 - "$CONF" "$VERSION" << 'PYEOF'
          import json, sys
          path, version = sys.argv[1], sys.argv[2]
          with open(path) as f:
              conf = json.load(f)
          conf["version"] = version
          with open(path, "w") as f:
              json.dump(conf, f, indent=2)
              f.write("\n")
          PYEOF

          grep -n "\"version\"" "$CONF"

      - name: Quitar rutas dinámicas web-only (no compatibles con output:export)
        # /garlia/libros/[slug] (y su subruta anidada [slug]/leer/[orden]) usan
        # SSR + generateMetadata y solo tienen sentido en el deploy de Vercel.
        # En el build de Tauri (output:"export") ni siquiera deben existir los
        # archivos: el APK usa las rutas estáticas /garlia/libros/detalle?slug=...
        # y /garlia/libros/leer?slug=&orden= en su lugar (ver esos page.tsx).
        # Borrar la carpeta [slug] completa alcanza: leer/[orden] vive anidada
        # adentro, así que se va con el mismo rm -rf.
        run: rm -rf "src/app/(public)/garlia/libros/[slug]"

      - name: Quitar ruta dinámica web-only de perfiles (no compatible con output:export)
        # /garlia/personal/[username] también usa SSR + generateMetadata (perfil
        # público de jugador) y solo tiene sentido en Vercel. El APK usa la ruta
        # estática /garlia/personal/detalle?username=... en su lugar.
        run: rm -rf "src/app/(public)/garlia/personal/[username]"

      - name: Quitar ruta dinámica web-only de canciones (no compatible con output:export)
        # /garlia/canciones/[slug] también usa SSR + generateMetadata y solo
        # tiene sentido en Vercel. El APK usa la ruta estática
        # /garlia/canciones/detalle?slug=... en su lugar.
        run: rm -rf "src/app/(public)/garlia/canciones/[slug]"


      - name: Instalar Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Optimizar tamaño del binario Rust (strip + LTO + opt-level=s)
        # Verificado con adb: el APK de v0.4.8 SÍ instala bien (probado por
        # USB/adb en el mismo Redmi que fallaba desde el navegador) — el
        # problema real nunca fue el build, fue el navegador de MIUI cortando
        # la descarga de un .apk de ~300MB desde GitHub. La causa de que
        # pesara 300MB: los 4 libapp_lib.so (arm64, armv7, x86, x86_64) salían
        # "not stripped" (~70-77MB cada uno) porque Cargo no tenía un perfil
        # de release optimizado para tamaño.
        #
        # Esto agrega [profile.release] a src-tauri/Cargo.toml SOLO si el
        # archivo no tiene ya una sección [profile.release] (para no pisar
        # configuración existente). Con strip=true + lto=true + opt-level="s"
        # + panic="abort", cada .so debería bajar de ~70MB a ~10-15MB —
        # llevando el universal APK de ~300MB a ~50-70MB. Son las opciones
        # recomendadas oficialmente por Tauri: https://v2.tauri.app/concept/size/
        run: |
          CARGO_FILE="src-tauri/Cargo.toml"

          if grep -q "^\[profile.release\]" "$CARGO_FILE"; then
            echo "Ya existe [profile.release] en Cargo.toml — no se toca para no pisar configuración existente."
            echo "Contenido actual de esa sección:"
            awk '/^\[profile.release\]/,/^\[/{if (!/^\[profile.release\]/ && /^\[/ && !/^\[profile.release\]/) exit; print}' "$CARGO_FILE"
          else
            echo "" >> "$CARGO_FILE"
            cat >> "$CARGO_FILE" << 'EOF'
          [profile.release]
          codegen-units = 1  # compilar de a un crate por vez, mejor optimización de LLVM
          lto = true         # link-time optimization entre todos los crates
          opt-level = "s"    # priorizar tamaño de binario sobre velocidad
          panic = "abort"    # sin unwinding de panics, menos código generado
          strip = true       # quitar símbolos de debug del binario final
          EOF
            echo "Agregado [profile.release] a Cargo.toml:"
            tail -6 "$CARGO_FILE"
          fi

      - name: Inicializar el proyecto Android de Tauri
        # Siempre se borra gen/android antes de generarlo de nuevo: si quedara
        # a medio generar (de un run anterior, de un residuo de checkout, o de
        # cuando esta carpeta todavía estaba commiteada por error en el repo),
        # `tauri android init` se niega a correr con un error de "Project
        # directory ... does not exist" en vez de sobreescribir solo. Partir
        # siempre de cero es lo único que garantiza que quede sincronizado con
        # el tauri.conf.json / Cargo.toml actuales.
        #
        # Va ANTES de restaurar el keystore: si corriera después, el rm -rf
        # de este paso borraría el .jks que el paso de keystore ya había
        # escrito adentro de gen/android (error real que tuvimos: Gradle no
        # encontraba el keystore porque este paso se lo llevó puesto).
        run: |
          rm -rf src-tauri/gen/android
          npx tauri android init

      - name: Restaurar el keystore de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p src-tauri/gen/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/src-tauri/gen/android/upload-keystore.jks"

      - name: Restaurar google-services.json (Firebase / FCM)
        # google-services.json tiene que vivir en gen/android/app/ (mismo
        # nivel que el build.gradle.kts del módulo app) para que el plugin
        # de Gradle de Google Services lo detecte. Como gen/android se borra
        # y regenera desde cero en cada build (ver paso "Inicializar el
        # proyecto Android de Tauri" más arriba), este archivo no puede
        # vivir commiteado en el repo — se restaura acá desde un secret en
        # cada corrida, igual que el keystore de firma.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p src-tauri/gen/android/app
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$GITHUB_WORKSPACE/src-tauri/gen/android/app/google-services.json"
          echo "google-services.json restaurado en gen/android/app/"

      - name: Aplicar plugin de Google Services + Firebase Messaging al Gradle
        # Dos archivos generados por `tauri android init` hay que tocar:
        #   - gen/android/build.gradle.kts (raíz del proyecto Android):
        #     agregar el classpath del plugin com.google.gms:google-services.
        #   - gen/android/app/build.gradle.kts (módulo app):
        #     aplicar ese plugin + agregar la dependencia de
        #     firebase-messaging (vía el BoM de Firebase, así no hay que
        #     fijar versión a mano).
        # Igual que con el signing, se hace con Python para no depender de
        # que el archivo generado tenga siempre el mismo formato exacto de
        # indentación que un sed frágil podría romper.
        run: |
          ROOT_GRADLE="src-tauri/gen/android/build.gradle.kts"
          APP_GRADLE="src-tauri/gen/android/app/build.gradle.kts"

          python3 - "$ROOT_GRADLE" "$APP_GRADLE" << 'PYEOF'
          import re
          import sys

          root_path, app_path = sys.argv[1], sys.argv[2]

          # ── build.gradle.kts de raíz: agregar el classpath del plugin ──
          with open(root_path) as f:
              root = f.read()

          if "com.google.gms:google-services" not in root:
              # `tauri android init` genera un bloque buildscript { dependencies { ... } }
              # con el classpath del Android Gradle Plugin. Insertamos el
              # nuestro justo después de esa línea.
              patron = re.compile(r'(classpath\("com\.android\.tools\.build:gradle:[^"]+"\)\n)')
              nuevo_root, n = patron.subn(
                  r'\1        classpath("com.google.gms:google-services:4.4.2")\n',
                  root,
                  count=1,
              )
              assert n == 1, "No se encontró el classpath del AGP en build.gradle.kts de raíz — revisar a mano."
              with open(root_path, "w") as f:
                  f.write(nuevo_root)
              print("Classpath de google-services agregado a build.gradle.kts de raíz.")
          else:
              print("build.gradle.kts de raíz ya tiene el plugin de google-services, no se toca.")

          # ── build.gradle.kts de app: aplicar plugin + dependencia ──
          with open(app_path) as f:
              app = f.read()

          if "com.google.gms.google-services" not in app:
              # El bloque plugins { ... } está al principio del archivo.
              patron_plugins = re.compile(r'(plugins\s*\{\n)')
              app, n = patron_plugins.subn(
                  r'\1    id("com.google.gms.google-services")\n',
                  app,
                  count=1,
              )
              assert n == 1, "No se encontró el bloque plugins { en build.gradle.kts de app — revisar a mano."
              print("Plugin com.google.gms.google-services aplicado en build.gradle.kts de app.")
          else:
              print("build.gradle.kts de app ya aplica el plugin de google-services.")

          if "firebase-messaging" not in app:
              # El bloque dependencies { ... } ya existe (Tauri agrega las
              # suyas ahí). Insertamos el BoM de Firebase + firebase-messaging
              # justo después de la línea "dependencies {".
              firebase_deps = (
                  '    implementation(platform("com.google.firebase:firebase-bom:33.5.1"))\n'
                  '    implementation("com.google.firebase:firebase-messaging")\n'
              )
              patron_deps = re.compile(r'(dependencies\s*\{\n)')
              app, n = patron_deps.subn(r'\1' + firebase_deps, app, count=1)
              assert n == 1, "No se encontró el bloque dependencies { en build.gradle.kts de app — revisar a mano."
              print("Dependencia de firebase-messaging agregada en build.gradle.kts de app.")
          else:
              print("build.gradle.kts de app ya tiene firebase-messaging.")

          with open(app_path, "w") as f:
              f.write(app)
          PYEOF

      - name: Forzar compileSdk/targetSdk compatibles con AGP
        # setup-android@v3 instala el SDK más nuevo (API 36), pero la Tauri
        # CLI trae empaquetado AGP 8.5.1, que solo soporta oficialmente hasta
        # compileSdk 34. Se deja en 34 por prolijidad y para evitar el warning
        # de Gradle, aunque quedó confirmado (con adb + inspección manual del
        # APK) que esto NO era la causa del error de parsing original.
        run: |
          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"
          sed -i 's/compileSdk = [0-9]\+/compileSdk = 34/' "$GRADLE_FILE"
          sed -i 's/targetSdk = [0-9]\+/targetSdk = 34/' "$GRADLE_FILE"
          echo "Quedó configurado así:"
          grep -n "compileSdk\|targetSdk" "$GRADLE_FILE"

      - name: Configurar firma de release
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # storeFile con ruta ABSOLUTA — con ruta relativa, Gradle la resuelve
          # distinto según si evalúa keystore.properties desde la raíz del
          # proyecto Android o desde el módulo app/, y termina buscando en el
          # lugar equivocado (error real que tuvimos: "Keystore file
          # .../app/upload-keystore.jks not found").
          cat > src-tauri/gen/android/keystore.properties << EOF
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeFile=$GITHUB_WORKSPACE/src-tauri/gen/android/upload-keystore.jks
          EOF

      - name: Aplicar signingConfig al build.gradle.kts
        # `tauri android init` no deja el build de "release" firmado por
        # defecto — hay que declarar el signingConfig a mano y asignarlo al
        # buildType release, o Gradle sigue generando *-unsigned.apk aunque
        # keystore.properties exista. Ver https://github.com/tauri-apps/tauri/issues/10313
        #
        # La estructura real que genera `tauri android init` (Tauri 2.0 RC)
        # usa `getByName("release") { ... }` dentro de buildTypes, y ya
        # importa java.util.Properties arriba para leer tauri.properties —
        # el patch reusa esa instancia en vez de crear una nueva.
        run: |
          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"

          if grep -q "keystorePropertiesFile" "$GRADLE_FILE"; then
            echo "El build.gradle.kts ya tiene signingConfig, no se toca."
            exit 0
          fi

          python3 - "$GRADLE_FILE" << 'PYEOF'
          import re
          import sys

          path = sys.argv[1]
          with open(path, "r") as f:
              contenido = f.read()

          # 1. Carga de keystore.properties, insertada después del import de
          #    Properties que ya existe (no duplicamos el import).
          preamble = '''import java.io.FileInputStream

          val keystorePropertiesFile = rootProject.file("keystore.properties")
          val keystoreProperties = Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''
          contenido = contenido.replace(
              "import java.util.Properties\n",
              "import java.util.Properties\n" + preamble,
              1,
          )

          # 2. Inserta signingConfigs dentro de android { ... }, antes de
          #    defaultConfig para que quede declarado primero.
          signing_block = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["password"] as String?
                  }
              }
          '''
          contenido = re.sub(r"(android\s*\{\n)", r"\1" + signing_block, contenido, count=1)

          # 3. Asigna signingConfig al buildType release, que en este proyecto
          #    usa la sintaxis getByName("release") { ... } (con llaves que
          #    pueden tener contenido multilínea, por eso el match no es codicioso).
          patron_release = re.compile(
              r'(getByName\("release"\)\s*\{)', re.DOTALL
          )
          contenido, n = patron_release.subn(
              r'\1\n            signingConfig = signingConfigs.getByName("release")',
              contenido,
              count=1,
          )

          with open(path, "w") as f:
              f.write(contenido)

          assert "signingConfigs" in contenido, "No se pudo insertar signingConfigs — revisar build.gradle.kts a mano."
          assert n == 1, "No se encontró el bloque getByName(\"release\") { — revisar build.gradle.kts a mano."

          print("build.gradle.kts parcheado con signingConfig de release.")
          PYEOF

      - name: Verificar que el gradle quedó con signing
        run: |
          grep -q "signingConfigs" src-tauri/gen/android/app/build.gradle.kts || {
            echo "::error::build.gradle.kts no tiene signingConfigs — el APK saldría sin firmar."
            cat src-tauri/gen/android/app/build.gradle.kts
            exit 1
          }

      - name: Verificar que Firebase/google-services quedó aplicado
        run: |
          test -f src-tauri/gen/android/app/google-services.json || {
            echo "::error::Falta google-services.json en gen/android/app/ — revisar el secret GOOGLE_SERVICES_JSON_BASE64."
            exit 1
          }
          grep -q "com.google.gms.google-services" src-tauri/gen/android/app/build.gradle.kts || {
            echo "::error::El plugin com.google.gms.google-services no quedó aplicado en build.gradle.kts de app."
            exit 1
          }
          grep -q "firebase-messaging" src-tauri/gen/android/app/build.gradle.kts || {
            echo "::error::La dependencia firebase-messaging no quedó en build.gradle.kts de app."
            exit 1
          }
          echo "Firebase/google-services OK."

      - name: Instalar el servicio de FCM (GarliaFirebaseMessagingService + PuenteFcm)
        # Los .kt viven en src-tauri/android-templates/ (commiteados, fuera
        # de gen/android que se borra en cada build) y se copian acá al
        # paquete Java real de la app generada por Tauri.
        run: |
          DESTINO="src-tauri/gen/android/app/src/main/java/com/frani/garlia"
          mkdir -p "$DESTINO"
          cp src-tauri/android-templates/java/com/frani/garlia/GarliaFirebaseMessagingService.kt "$DESTINO/"
          cp src-tauri/android-templates/java/com/frani/garlia/PuenteFcm.kt "$DESTINO/"
          echo "Archivos copiados a $DESTINO:"
          ls "$DESTINO"

      - name: Registrar el puente FCM en MainActivity.kt
        # `tauri android init` genera MainActivity.kt con una referencia al
        # WebView interno de Tauri/WRY. Le agregamos una sola línea en
        # onWebViewCreate (hook que Tauri sí expone) para registrar ese
        # WebView en PuenteFcm — así el servicio de FCM puede llamar JS
        # sobre él sin que nosotros toquemos el resto del archivo generado.
        run: |
          MAIN_ACTIVITY=$(find src-tauri/gen/android/app/src/main/java -name "MainActivity.kt")
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::No se encontró MainActivity.kt generado por Tauri."
            exit 1
          fi
          echo "MainActivity.kt encontrado en: $MAIN_ACTIVITY"

          python3 - "$MAIN_ACTIVITY" << 'PYEOF'
          import re
          import sys

          path = sys.argv[1]
          with open(path) as f:
              contenido = f.read()

          if "PuenteFcm.registrarWebView" in contenido:
              print("MainActivity.kt ya tiene el puente FCM registrado, no se toca.")
              sys.exit(0)

          # Tauri (WRY) expone un hook onWebViewCreate(webView, ...) en la
          # MainActivity generada. Si existe, enganchamos ahí. Si el nombre
          # exacto cambiara entre versiones de Tauri, este assert corta el
          # build con un mensaje claro en vez de dejar el push silenciosamente roto.
          patron = re.compile(r'(override fun onWebViewCreate\([^)]*\)\s*\{\n)')
          nuevo_contenido, n = patron.subn(
              r'\1        com.frani.garlia.PuenteFcm.registrarWebView(webView)\n',
              contenido,
              count=1,
          )
          assert n == 1, (
              "No se encontró 'override fun onWebViewCreate(' en MainActivity.kt — "
              "la API de Tauri pudo haber cambiado. Registrar el puente FCM a mano."
          )

          with open(path, "w") as f:
              f.write(nuevo_contenido)
          print("Puente FCM registrado en MainActivity.kt.")
          PYEOF

      - name: Agregar permiso y servicio de FCM al AndroidManifest.xml
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" << 'PYEOF'
          import re
          import sys

          path = sys.argv[1]
          with open(path) as f:
              contenido = f.read()

          cambios = False

          # Permiso POST_NOTIFICATIONS (obligatorio desde Android 13 / API 33
          # para poder mostrar notificaciones). Se pide en runtime del lado
          # JS/Tauri; acá solo se declara en el manifest.
          if "android.permission.POST_NOTIFICATIONS" not in contenido:
              patron_manifest_open = re.compile(r'(<manifest[^>]*>\n)')
              contenido, n = patron_manifest_open.subn(
                  r'\1    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n',
                  contenido,
                  count=1,
              )
              assert n == 1, "No se encontró la etiqueta <manifest ...> de apertura."
              cambios = True
              print("Permiso POST_NOTIFICATIONS agregado.")

          # Declaración del <service> de FCM, dentro de <application ...>.
          if "GarliaFirebaseMessagingService" not in contenido:
              service_block = (
                  '        <service\n'
                  '            android:name="com.frani.garlia.GarliaFirebaseMessagingService"\n'
                  '            android:exported="false">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="com.google.firebase.MESSAGING_EVENT" />\n'
                  '            </intent-filter>\n'
                  '        </service>\n'
              )
              patron_app_open = re.compile(r'(<application[^>]*>\n)')
              contenido, n = patron_app_open.subn(r'\1' + service_block, contenido, count=1)
              assert n == 1, "No se encontró la etiqueta <application ...> de apertura."
              cambios = True
              print("Servicio GarliaFirebaseMessagingService agregado.")

          if cambios:
              with open(path, "w") as f:
                  f.write(contenido)
          else:
              print("AndroidManifest.xml ya tenía el permiso y el servicio, no se tocó.")
          PYEOF

          echo "Verificación final del manifest:"
          grep -n "POST_NOTIFICATIONS\|GarliaFirebaseMessagingService" "$MANIFEST"

      - name: Build del APK universal (release, firmado)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_FORMSPREE_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          # Activa output:"export" en next.config.mjs y las rutas estáticas
          # (detalle/leer con query params) en vez de las [slug] dinámicas
          # que solo sirven para el deploy web con SSR en Vercel.
          NEXT_PUBLIC_BUILD_TARGET: tauri
        run: npx tauri android build --apk

      - name: Ubicar el .apk generado
        id: apk
        run: |
          APK_PATH=$(find src-tauri/gen/android -iname "*universal-release*.apk" ! -iname "*unsigned*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No se encontró un .apk firmado. Archivos disponibles:" >&2
            find src-tauri/gen/android -iname "*.apk" >&2
            exit 1
          fi
          echo "APK encontrado: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Crear el Release (draft) y subir el APK
        # draft: true — este release queda oculto hasta que el workflow
        # publish-release.yml lo publique, una vez que build-android Y
        # build-linux hayan terminado los dos. Si el release ya existe como
        # draft (porque el otro workflow corrió primero), softprops lo
        # actualiza agregando este asset en vez de pisarlo.
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
