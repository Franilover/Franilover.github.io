name: publish-release

# Se dispara automáticamente cada vez que termina build-android o
# build-linux (los dos corren en paralelo por el mismo tag vX.Y.Z).
# Cada vez que uno de los dos termina, este workflow chequea si EL OTRO
# también ya terminó con éxito para el mismo tag — si es así, publica el
# Release (que hasta ahora estaba en draft). Si el otro todavía no terminó,
# no hace nada y espera a que lo dispare el próximo que termine.
#
# No hace falta tocar nada de este archivo cuando agregues más plataformas
# en el futuro (ej. Windows/macOS): solo hay que sumar su nombre a la lista
# WORKFLOWS_REQUERIDOS de abajo y agregarlo también a workflow_run.workflows.

on:
  workflow_run:
    workflows: ["build-android", "build-linux"]
    types:
      - completed
  workflow_dispatch:
    # Permite correrlo a mano desde la pestaña Actions (botón "Run workflow"),
    # útil para publicar un release sin esperar un tag nuevo — por ejemplo
    # cuando build-android y build-linux ya terminaron ANTES de que este
    # workflow existiera o se corrigiera, y por eso workflow_run nunca los
    # "vio" terminar.
    inputs:
      tag:
        description: "Tag a publicar (ej. v0.4.27)"
        required: true
        type: string

permissions:
  contents: write # necesario para publicar el Release

jobs:
  publish:
    runs-on: ubuntu-latest
    # Corre si: (a) nos disparó un workflow_run exitoso, o (b) lo lanzaste
    # manualmente con workflow_dispatch (ahí no hay conclusion que chequear).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout del repo
        # Necesario para que `gh` (run list / release edit) sepa a qué repo
        # apuntar — sin esto tira "not a git repository".
        uses: actions/checkout@v4

      - name: Chequear que todos los builds del tag ya terminaron
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          # WORKFLOWS_REQUERIDOS = todos los builds que tienen que TERMINAR
          # (con éxito o con error) antes de publicar. Agregar acá el
          # nombre ("name:") de cualquier workflow nuevo que suba assets
          # al mismo release.
          #
          # Ya no exigimos que TODOS terminen con éxito: si alguno falla,
          # igual publicamos el release en cuanto sepamos que el resto ya
          # terminó, para no bloquear el build que sí compiló bien. El que
          # falló simplemente no va a tener su asset en el release.
          WORKFLOWS_REQUERIDOS=("build-android" "build-linux")

          echo "Tag: $TAG"
          TODOS_TERMINARON=true
          HUBO_FALLA=false

          for WF in "${WORKFLOWS_REQUERIDOS[@]}"; do
            # Busca la corrida más reciente de ese workflow para este tag
            # exacto (head_branch en workflow_run es el nombre del tag).
            CONCLUSION=$(gh run list \
              --workflow "$WF" \
              --branch "$TAG" \
              --limit 1 \
              --json conclusion \
              --jq '.[0].conclusion // "pendiente"')

            echo "  - $WF: $CONCLUSION"

            if [ "$CONCLUSION" == "pendiente" ]; then
              TODOS_TERMINARON=false
            elif [ "$CONCLUSION" != "success" ]; then
              HUBO_FALLA=true
            fi
          done

          echo "todos_terminaron=$TODOS_TERMINARON" >> "$GITHUB_OUTPUT"
          echo "hubo_falla=$HUBO_FALLA" >> "$GITHUB_OUTPUT"

      - name: Publicar el Release
        if: steps.check.outputs.todos_terminaron == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ steps.check.outputs.hubo_falla }}" == "true" ]; then
            echo "⚠️  Algún build falló, pero el resto ya terminó — se publica el release igual con los assets disponibles."
          else
            echo "Todos los builds terminaron OK — publicando release de $TAG"
          fi
          gh release edit "$TAG" --draft=false

      - name: Esperar al resto
        if: steps.check.outputs.todos_terminaron != 'true'
        run: echo "Todavía falta algún build por terminar — no se publica el release aún. Este job se va a volver a disparar cuando termine el que falta."
